<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude — conversations</title>
  <style>
    :root {
      color-scheme: dark;
      --fallback-background-primary: #181818;
      --fallback-background-secondary: #303030;
      --fallback-background-tertiary: #1b1b1b;
      --fallback-composer: #333333;
      --fallback-text-primary: #ffffff;
      --fallback-text-secondary: #a0a0a0;
      --fallback-text-tertiary: #9a9a9a;
      --fallback-border: #292929;
      --bg: var(--color-background-primary, var(--fallback-background-primary));
      --sidebar: var(--color-background-tertiary, var(--fallback-background-tertiary));
      --surface: var(--color-background-secondary, var(--fallback-background-secondary));
      --composer: var(--color-background-secondary, var(--fallback-composer));
      --text: var(--color-text-primary, var(--fallback-text-primary));
      --muted: var(--color-text-secondary, var(--fallback-text-secondary));
      --quiet: var(--color-text-tertiary, var(--fallback-text-tertiary));
      --line: var(--color-border-secondary, var(--fallback-border));
      --ring: var(--color-ring-primary, var(--text));
      --danger: var(--color-text-danger, var(--text));
      --warning: var(--color-text-warning, var(--muted));
      font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
      font-size: var(--font-text-sm-size, 14px); line-height: var(--font-text-sm-line-height, 1.5); font-weight: var(--font-weight-normal, 400);
    }
    :root[data-theme=light] {
      color-scheme: light;
      --fallback-background-primary: #ffffff;
      --fallback-background-secondary: #eeeeee;
      --fallback-background-tertiary: #f7f7f7;
      --fallback-composer: #f0f0f0;
      --fallback-text-primary: #202020;
      --fallback-text-secondary: #656565;
      --fallback-text-tertiary: #6b6b6b;
      --fallback-border: #e7e7e7;
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--text) }
    button, input, textarea { font: inherit; color: inherit }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent }
    button:disabled { cursor: default; opacity: .45 }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px }
    svg { display: block; width: 17px; height: 17px; flex: none }
    button svg { pointer-events: none }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap }
    [hidden] { display: none !important }
    .shell { height: 100dvh; min-height: 360px; display: flex; flex-direction: column; overflow: hidden }
    .topbar { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg) }
    .brand-name { font-size: 14px; font-weight: var(--font-weight-semibold, 600) }
    .toolbar { display: flex; align-items: center; gap: 3px }
    .icon-button { width: 34px; height: 34px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 7px; color: var(--muted) }
    .icon-button:hover { background: var(--surface); color: var(--text) }
    .demo-banner { padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted) }
    .demo-banner strong { font-weight: var(--font-weight-medium, 550); margin-right: 6px; color: var(--text) }
    .main { display: grid; grid-template-columns: minmax(220px, 31%) minmax(0, 1fr); flex: 1; min-height: 0 }
    .sidebar { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--sidebar) }
    .sidebar-head { padding: 16px 14px 12px }
    .heading-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px }
    .heading-row h1 { font-size: 12px; font-weight: var(--font-weight-medium, 500); color: var(--muted); margin: 0 }
    .count { font-size: 11px; color: var(--quiet) }
    .search-wrap { position: relative }
    .search-wrap svg { position: absolute; left: 9px; top: 9px; width: 15px; height: 15px; color: var(--quiet) }
    .search { height: 36px; width: 100%; border: 1px solid var(--line); border-radius: 7px; background: transparent; padding: 5px 8px 5px 30px; color: var(--text); font-size: 12px }
    .search::placeholder { color: var(--quiet) }
    .tabs { display: flex; gap: 15px; padding: 0 15px 7px; border-bottom: 1px solid var(--line) }
    .tab { min-height: 32px; padding: 5px 0; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: var(--font-weight-normal, 400) }
    .tab[aria-selected=true] { color: var(--text) }
    .chat-list { padding: 7px; flex: 1; overflow: auto; min-height: 0 }
    .chat { width: 100%; display: block; padding: 10px 9px; margin-bottom: 2px; text-align: left; border: 0; border-radius: 7px; background: transparent }
    .chat:hover, .chat[aria-current=true] { background: var(--surface) }
    .chat-info { display: block; min-width: 0 }
    .chat-top { display: flex; align-items: baseline; gap: 7px }
    .chat-title { font-size: 13px; font-weight: var(--font-weight-normal, 400); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .chat-time { font-size: 10px; color: var(--quiet); white-space: nowrap; font-variant-numeric: tabular-nums }
    .chat-cwd { display: block; margin-top: 4px; font-size: 11px; color: var(--quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .list-foot { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 9px 14px 12px; border-top: 1px solid var(--line); color: var(--quiet); font-size: 11px; line-height: 1.5 }
    .list-foot button { padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 11px; text-decoration: underline }
    .list-empty { padding: 27px 9px; color: var(--muted); font-size: 12px; line-height: 1.6 }
    .list-empty strong { display: block; color: var(--text); font-weight: var(--font-weight-normal, 400); margin-bottom: 4px }
    .conversation { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg) }
    .conversation-head { min-height: 57px; padding: 11px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px; flex: none }
    .conversation-heading { flex: 1; min-width: 0 }
    .conversation-title { font-size: 13px; line-height: 1.4; font-weight: var(--font-weight-medium, 500); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .conversation-subtitle { font-size: 11px; color: var(--quiet); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .conversation-id { font-size: 10px; color: var(--quiet); margin-top: 2px; font-family: var(--font-mono, ui-monospace, "Cascadia Mono", Consolas, monospace); user-select: all; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .mobile-back { display: none }
    .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; color: var(--muted) }
    .welcome h2 { font-size: 15px; color: var(--text); font-weight: var(--font-weight-normal, 400); margin: 0 0 9px }
    .welcome p { font-size: 13px; line-height: 1.7; max-width: 290px; margin: 0 }
    .timeline { flex: 1; min-height: 0; overflow: auto; padding: 18px 23px 24px; scroll-behavior: auto }
    .history-control { display: flex; justify-content: center; margin-bottom: 16px }
    .small-button { min-height: 30px; font-size: 11px; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted) }
    .small-button:hover { background: var(--surface); color: var(--text) }
    .day { margin: 14px 0 24px; color: var(--quiet); font-size: 11px; text-align: center }
    .message-row { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 27px }
    .message-row.outgoing { align-items: flex-end }
    .message-label { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; margin: 0 0 7px }
    .manual-tag { font-size: 10px; color: var(--quiet) }
    .bubble { width: 100%; min-width: 0; padding: 0; background: transparent; border: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--font-text-md-size, 14px); line-height: var(--font-text-md-line-height, 1.7) }
    .outgoing .bubble { width: auto; max-width: min(88%, 580px); padding: 12px 15px; border-radius: 16px; background: var(--surface) }
    .message-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 7px; color: var(--quiet); font-size: 10px; font-variant-numeric: tabular-nums }
    .message-meta.warning { color: var(--warning) }
    .message-meta.failed { color: var(--danger) }
    .notice-detail { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; text-align: right; max-width: 88% }
    .notice-detail.warning { color: var(--warning) }
    .notice-detail.failed { color: var(--danger) }
    .timeline-empty { margin: 44px 0; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 340px }
    .timeline-empty strong { display: block; margin-bottom: 5px; color: var(--text); font-weight: var(--font-weight-normal, 400) }
    .alert { display: flex; align-items: flex-start; gap: 10px; margin: 0 18px 12px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; flex: none }
    .alert.error { color: var(--danger) }
    .alert-text { flex: 1; min-width: 0 }
    .alert-actions { display: flex; gap: 12px; flex: none }
    .alert button { border: 0; background: transparent; color: inherit; text-decoration: underline; padding: 0; font-size: 11px; white-space: nowrap }
    .composer-wrap { padding: 0 16px 12px; flex: none }
    .composer { padding: 13px 14px 10px; background: var(--composer); border: 1px solid var(--color-border-tertiary, var(--line)); border-radius: 21px; box-shadow: 0 1px 2px rgb(0 0 0 / 8%) }
    .composer:focus-within { outline: 2px solid var(--ring); outline-offset: 2px }
    .composer textarea { display: block; width: 100%; min-height: 44px; max-height: 140px; padding: 2px 1px 7px; border: 0; outline: 0; background: transparent; resize: none; overflow-y: hidden; color: var(--text); font-size: var(--font-text-md-size, 14px); line-height: var(--font-text-md-line-height, 1.55) }
    .composer textarea::placeholder { color: var(--quiet) }
    .composer textarea:focus-visible { outline: 0 }
    .composer-bottom { display: flex; justify-content: flex-end; align-items: center; min-height: 32px; margin-top: 2px }
    .composer-note { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; margin-right: 12px; color: var(--quiet); font-size: 11px; line-height: 1.45 }
    .composer-dest { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .refusal-detail { margin-top: 4px; font-size: 12px; color: var(--danger) }
    .copy-disclosure { color: var(--muted); white-space: normal; overflow-wrap: anywhere }
    .message-row .small-button, .alert button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 6px; padding: 5px 9px; text-decoration: none; min-height: 30px }
    .message-row .small-button:hover, .alert button:hover { border-color: var(--muted) }
    .composer-hint.problem { color: var(--danger) }
    .send-button { display: grid; place-items: center; flex: 0 0 32px; aspect-ratio: 1 / 1; width: 32px; min-width: 32px; max-width: 32px; height: 32px; min-height: 32px; max-height: 32px; align-self: flex-end; padding: 0; appearance: none; background: var(--text); color: var(--bg); border: 0; border-radius: 50% }
    .send-button:hover:not(:disabled) { background: var(--color-background-info, var(--text)); color: var(--color-text-inverse, var(--bg)) }
    .send-button svg { width: 16px; height: 16px }
    .composer-inactive { padding: 12px 0; font-size: 12px; line-height: 1.7; color: var(--muted) }
    .composer-inactive strong { display: block; color: var(--text); font-weight: var(--font-weight-normal, 400); margin-bottom: 3px }
    .connection-error { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--danger); font-size: 12px }
    .spin svg { animation: spin 1s linear infinite }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media(prefers-reduced-motion:reduce) { .spin svg { animation: none } }
    @media(min-width:1150px) { .main { grid-template-columns: 280px minmax(0,1fr) } .timeline { padding-left: 6%; padding-right: 6% } .composer-wrap { padding-left: 6%; padding-right: 6% } .alert { margin-left: 6%; margin-right: 6% } }
    @media(max-width:620px) { .topbar { padding: 0 13px; height: 45px } .main { grid-template-columns: 1fr } .sidebar { border-right: 0 } .conversation { display: none } .shell.has-selection .sidebar { display: none } .shell.has-selection .conversation { display: flex } .mobile-back { display: grid } .conversation-head { padding: 10px 13px } .timeline { padding: 16px 16px 21px } .outgoing .bubble { max-width: 91% } .composer-wrap { padding: 0 12px 12px } .alert { margin: 0 12px 10px } .welcome { display: none } .demo-banner { padding: 6px 13px; font-size: 10px } }
  </style>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand-name">Claude</div>
      <div class="toolbar"><span class="sr-only" id="connection-label" role="status">Connecting…</span><button class="icon-button" id="focus-search" type="button" aria-label="Search conversations" title="Search conversations"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button class="icon-button" id="refresh" type="button" aria-label="Refresh conversations and history" title="Refresh"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a8 8 0 1 0 .4 7M20 3v5h-5"/></svg></button></div>
    </header>
    <div class="demo-banner" id="demo-banner" hidden><strong>Demo</strong>Demo interface. No real messages are sent.</div>
    <div class="connection-error" id="connection-error" role="alert" hidden></div>
    <div class="main">
      <aside class="sidebar" aria-label="Conversation list">
        <div class="sidebar-head"><div class="heading-row"><h1>Conversations</h1><span class="count" id="chat-count">—</span></div><div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="search">Search by title, project or conversation ID</label><input class="search" id="search" type="search" placeholder="Search titles, projects or IDs" autocomplete="off"></div></div>
        <div class="tabs" role="tablist" aria-label="Show conversations"><button class="tab" id="tab-contacted" role="tab" aria-selected="true" aria-controls="chat-list" type="button">Messaged</button><button class="tab" id="tab-all" role="tab" aria-selected="false" aria-controls="chat-list" type="button" tabindex="-1">All</button></div>
        <div class="chat-list" id="chat-list" role="tabpanel" aria-label="Claude Code conversations"></div>
        <div class="list-foot" id="list-foot" hidden><span id="list-note"></span><button type="button" id="catalog-more" hidden>Search more archived conversations</button></div>
      </aside>
      <main class="conversation" aria-label="Conversation">
        <div class="conversation-head" id="conversation-head" hidden><button class="icon-button mobile-back" id="back" type="button" aria-label="Back to the conversation list"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m14 6-6 6 6 6"/></svg></button><div class="conversation-heading"><h2 class="conversation-title" id="conversation-title"></h2><div class="conversation-subtitle" id="conversation-subtitle"></div><div class="conversation-id" id="conversation-id"></div></div></div>
        <div class="welcome" id="welcome"><h2>Select a Claude Code conversation</h2><p>Its bridge messages and a reply box will appear here.</p></div>
        <div class="timeline" id="timeline" aria-label="Message history" hidden></div>
        <div class="alert" id="conversation-alert" role="status" hidden><span class="alert-text" id="alert-text"></span><span class="alert-actions" id="alert-actions"></span></div>
        <div class="composer-wrap" id="composer-wrap" hidden><div class="composer-inactive" id="composer-inactive" hidden><strong id="inactive-title"></strong><span id="inactive-detail"></span></div><form class="composer" id="composer"><label class="sr-only" for="message">Message for the selected Claude Code conversation</label><textarea id="message" aria-describedby="composer-dest copy-disclosure composer-hint" rows="1" placeholder="Message to Claude Code…"></textarea><div class="composer-bottom"><div class="composer-note"><span class="composer-dest" id="composer-dest"></span><span class="copy-disclosure" id="copy-disclosure">A copy of the full text goes to this Codex chat.</span><span class="composer-hint" id="composer-hint" aria-live="polite"></span></div><button class="send-button" id="send" type="submit"><span class="sr-only" id="send-label">Send to Claude Code</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5"/></svg></button></div></form></div>
      </main>
    </div>
    <div class="sr-only" id="announcement" aria-live="polite"></div>
  </div>
  <script type="module">
  const $ = id => document.getElementById(id);
  const demo = location.hash === '#demo';
  const CATALOG = 'bridge-claude-codex/catalog';
  const OUTCOME = 'bridge-claude-codex/outcome';
  const LIMIT = 65536;
  const CATALOG_PAGES = 5;
  const KEEP_HISTORIES = 6;
  const state = { chats: new Map(), catalogCursor: null, catalogWarnings: [], catalogSignature: '', catalogLoading: false,
    selected: null, tab: 'contacted', query: '', owner: null, ready: false, ownerChanged: false, stopped: false,
    drafts: new Map(), revisions: new Map(), histories: new Map(), sends: new Map(), refusals: new Map(), outbox: new Map(),
    contacted: new Set(), noticeRetries: new Set(), refreshing: false };
  const rpcPending = new Map();
  let rpcId = 0, receiptVersion = 0;
  let hostOrigin = null;
  let initializeId = null;
  let initialLoad = false;
  let initialPanelResult = null;
  let poll = null;
  // The Enter action Codex applies, taken only from the host (K03: config.toml can differ from it).
  // Unknown means the safe mode: Enter adds a line and Ctrl/⌘+Enter sends.
  let enterMode = null;
  const initialPanelWaiters = [];
  const mac = typeof navigator === 'object' && /Mac|iPhone|iPad/.test(String(navigator?.platform || navigator?.userAgent || ''));
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const string = value => typeof value === 'string' ? value : '';
  const strings = value => Array.isArray(value) ? value.filter(item => typeof item === 'string' && item) : [];
  const timestamp = value => { const date = new Date(value); return Number.isFinite(date.getTime()) && date.getTime() > 0 ? date.getTime() : 0; };
  const targetOrigin = () => hostOrigin && hostOrigin !== 'null' ? hostOrigin : '*';
  const shortTime = value => timestamp(value) ? new Date(timestamp(value)).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
  const shortDate = value => timestamp(value) ? new Date(timestamp(value)).toLocaleDateString('en-US', { day: '2-digit', month: '2-digit' }) : '';
  const workspace = cwd => string(cwd).split(/[\\/]/).filter(Boolean).slice(-2).join(' / ');
  const count = value => value.toLocaleString('en-US');
  const bytesOf = value => new TextEncoder().encode(value).length;
  const keyOf = row => `${row.direction}:${row.id}`;
  const signatureOf = row => [row.status, row.notice_status, row.notice_retryable, row.notice_claimed, row.notice_reason, row.notice_omitted, row.notice_note, row.notice_retry, row.primary_note, row.notice_delivered, row.refusal?.reason].join('|');
  const modifier = mac ? '⌘' : 'Ctrl';
  function element(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
  function button(className, text, control, run) {
    const node = element('button', className, text); node.type = 'button'; node.dataset.control = control; node.addEventListener('click', run); return node;
  }
  function announce(text) { $('announcement').textContent = text; }
  function focusedControl() { return string(document.activeElement?.dataset?.control); }
  function restoreFocus(control, nodes) {
    if (!control) return;
    const stack = [...nodes];
    while (stack.length) { const node = stack.shift(); if (node?.dataset?.control === control) { if (document.activeElement !== node) node.focus({ preventScroll: true }); return; } stack.push(...(node?.children || [])); }
  }
  function theme(context) {
    if (!object(context)) return;
    if (context.theme === 'dark' || context.theme === 'light') document.documentElement.dataset.theme = context.theme;
    const variables = context.styles?.variables;
    if (object(variables)) for (const [name, value] of Object.entries(variables)) {
      if (/^--[a-zA-Z0-9_-]+$/.test(name) && typeof value === 'string') document.documentElement.style.setProperty(name, value);
    }
  }
  function hostComposer(context) {
    if (!object(context)) return;
    for (const [part, key] of [[context, 'composer_enter_behavior'], [context.composer,'enterBehavior'], [context['codex/composer'],'enterBehavior'], [context['openai/composer'],'enterBehavior']]) {
      if (!object(part) || !Object.hasOwn(part,key)) continue;
      const value = part[key], mode = value === 'send' ? 'enter' : value === 'newline' ? 'cmdAlways' : value;
      enterMode = ['enter','cmdIfMultiline','cmdAlways'].includes(mode) ? mode : null; break;
    }
  }
  function resizeComposer() {
    const input = $('message'); if (!input) return;
    input.style.height = 'auto';
    const height = Math.min(input.scrollHeight || 46, 140);
    input.style.height = `${height}px`;
    input.style.overflowY = (input.scrollHeight || 0) > 140 ? 'auto' : 'hidden';
  }
  function rpc(method, params) {
    if (!hostOrigin && method !== 'ui/initialize') return Promise.reject(new Error('Desktop connection is not established yet.'));
    const id = ++rpcId;
    if (method === 'ui/initialize') initializeId = id;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { rpcPending.delete(id); reject(new Error('Desktop did not respond in time.')); }, method === 'ui/initialize' ? 25000 : (Number('__BRIDGE_CALL_WAIT_MS__') || 120000));
      rpcPending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, targetOrigin());
    });
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method, params }, targetOrigin()); }
  function waitForInitialPanel() {
    if (initialPanelResult) return Promise.resolve(initialPanelResult);
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        const index = initialPanelWaiters.findIndex(waiter => waiter.resolve === resolve);
        if (index >= 0) initialPanelWaiters.splice(index, 1);
        resolve(null);
      }, 250);
      initialPanelWaiters.push({ resolve, timer });
    });
  }
  function receiveInitialPanel(result) {
    if (!initialPanelResult) initialPanelResult = result;
    while (initialPanelWaiters.length) {
      const waiter = initialPanelWaiters.shift(); clearTimeout(waiter.timer); waiter.resolve(initialPanelResult);
    }

    $('conversation-alert').hidden = !view; $('alert-text').textContent = view?.text || '';
    $('conversation-alert').classList.toggle('error', view?.tone === 'error');
    const actions = (view?.actions ?? []).map(([label, run]) => button('', label, `alert:${label}`, run));
    $('alert-actions').replaceChildren(...actions); restoreFocus(control, actions);
  }
  async function refresh(quiet = false, initial = null) {
    if (state.stopped || state.refreshing || (!demo && !hostOrigin)) return;
    state.refreshing = true; if (!quiet) $('refresh').classList.add('spin');
    try { await loadCatalog({ quiet, initial }); if (state.selected) await loadHistory(state.selected, { quiet }); }
    catch (error) { if (!quiet || !state.ready) showConnectionError(error.message); }
    finally { state.refreshing = false; $('refresh').classList.remove('spin'); }
  }
  $('search').addEventListener('input', () => { state.query = $('search').value; renderChats(); });
  for (const [id, tab] of [['tab-contacted', 'contacted'], ['tab-all', 'all']]) {
    $(id).addEventListener('click', () => { state.tab = tab; renderChats(); });
    $(id).addEventListener('keydown', event => { if (['ArrowLeft', 'ArrowRight'].includes(event.key)) { event.preventDefault(); state.tab = state.tab === 'all' ? 'contacted' : 'all'; renderChats(); $(state.tab === 'all' ? 'tab-all' : 'tab-contacted').focus(); } });
  }
  $('message').addEventListener('input', () => {
    const id = state.selected; if (!id || state.ownerChanged || state.stopped) return;
    state.drafts.set(id, $('message').value); state.revisions.set(id, (state.revisions.get(id) || 0) + 1); renderComposer(); renderAlert();
  });
  $('message').addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing) return;
    const shortcut = event.ctrlKey || event.metaKey; const mode = enterMode ?? 'cmdAlways';
    if (event.shiftKey && !shortcut) return;
    if (shortcut || mode === 'enter' || (mode === 'cmdIfMultiline' && !$('message').value.includes('\n'))) { event.preventDefault(); sendMessage(); }
  });
  $('composer').addEventListener('submit', event => { event.preventDefault(); sendMessage(); });
  $('refresh').addEventListener('click', () => refresh());
  $('catalog-more').addEventListener('click', () => searchMore());
  $('focus-search').addEventListener('click', () => { state.selected = null; renderChats(); renderConversation(); $('search').focus(); });
  $('back').addEventListener('click', () => { state.selected = null; renderChats(); renderConversation(); });
  const demoNow = Date.now();
  const demoChats = [
    { session_id: 'demo-interface', title: 'Desktop Bridge UI', cwd: 'C:/Projects/desktop-bridge', live: true, last_contact_at: demoNow - 300000, last_activity_at: demoNow - 180000 },
    { session_id: 'demo-review', title: 'Change review', cwd: 'C:/Projects/desktop-bridge', live: true, last_contact_at: demoNow - 3600000, last_activity_at: demoNow - 3200000 },
    { session_id: 'demo-archive', title: 'Plugin research', cwd: 'C:/Projects/research', live: false, last_contact_at: demoNow - 86400000, last_activity_at: demoNow - 86400000 },
    { session_id: 'demo-new', title: 'New Code session', cwd: 'C:/Projects/prototype', live: true, last_contact_at: null, last_activity_at: demoNow - 60000 },
  ];
  const demoMessages = new Map([
    ['demo-interface', [
      { id: 'demo-a', direction: 'to_claude', message: 'Please review the latest plugin documentation updates. Which changes are useful for our bridge?', created_at: demoNow - 1200000, status: 'submitted' },
      { id: 'demo-b', direction: 'to_codex', message: 'I reviewed the documentation. Result schemas, diagnostics, and correct send cancellation are useful for the current bridge.\n\nThe UI can now be a native panel with conversation selection, history, and manual messages.', created_at: demoNow - 900000, status: 'submitted' },
      { id: 'demo-c', direction: 'to_claude', message: 'Good. We will preserve the exact recipient and show delivery status clearly.', created_at: demoNow - 300000, status: 'submitted', manual: true, notice_status: 'submitted' },
      { id: 'demo-d', direction: 'to_codex', message: 'Yes. “Handed to Claude Code” means the bridge wrote it to the inbox. Reading and replying are separate events.', created_at: demoNow - 180000, status: 'submitted' },
    ]],
    ['demo-review', [{ id: 'demo-review-a', direction: 'to_codex', message: 'Review complete. You can leave a draft reply in this conversation and return later.', created_at: demoNow - 3200000, status: 'submitted' }]],
    ['demo-archive', [{ id: 'demo-archive-a', direction: 'to_codex', message: 'Research complete. This session is closed, but the conversation history is saved.', created_at: demoNow - 86400000, status: 'submitted' }]],
    ['demo-new', []],
  ]);
  async function demoCall(name, args) {
    if (name === 'bridge_panel') return { owner_thread_id: 'demo-owner', application: 'codex', sessions: demoChats, warnings: [], ...(initialLoad ? {} : { selected_session_id: 'demo-interface' }) };
    if (name === 'panel_history') return { session_id: args.session_id, messages: args.cursor ? [{ id: 'demo-older', direction: 'to_claude', message: 'Starting the Desktop Bridge discussion.', created_at: demoNow - 86400000, status: 'submitted' }] : demoMessages.get(args.session_id) || [], has_more: args.session_id === 'demo-interface' && !args.cursor, next_cursor: args.session_id === 'demo-interface' && !args.cursor ? 'demo-older' : null, warnings: [] };
    if (name === 'panel_send') {
      const message = { id: args.message_id, direction: 'to_claude', message: args.message, created_at: Date.now(), status: 'submitted', manual: true, notice_status: 'submitted' };
      demoMessages.get(args.session_id).push(message);

    }

  }
  renderChats(); renderConversation();
  if (demo) {
    $('demo-banner').hidden = false;
    await refresh(); initialLoad = true;
  } else {
    try {
      const result = await rpc('ui/initialize', { appInfo: { name: 'desktop-bridge-panel', version: '1.1.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' });
      theme(result.hostContext); hostComposer(result.hostContext); notify('ui/notifications/initialized', {});
      await refresh(false, await waitForInitialPanel());
      initialLoad = true;
    } catch (error) { $('connection-label').textContent = 'Not connected'; showConnectionError(error.message); }
    if (!state.stopped) poll = setInterval(() => { if (!state.stopped && document.visibilityState === 'visible' && state.ready) refresh(true); }, 12000);
  }
